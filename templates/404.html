{% extends "base.html" %}
{% set meta_title = meta_title or t('error.404.title') %}
{% set meta_description = meta_description or t('error.404.description') %}

{% block content %}
<section class="page-title-section page-title-dark py-5 scroll-animate">
    <div class="container-fluid px-3 px-md-4 text-center">
        <h1 class="display-4 fw-bold mb-3 hero-title">{{ t('error.404.heading') }}</h1>
        <p class="lead text-light">{{ t('error.404.message') }}</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">{{ t('error.back_home') }}</a>
    </div>
</section>
{% endblock %}
